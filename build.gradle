import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
  id "java-library" // Java plus providing specific knowledge about Java libraries
  id "de.monticore.generator" version "$mc_version" // MontiCore Plugin
  id "com.gradleup.shadow" version "8.3.11" // for creating the all-in-one jar
  id 'maven-publish'
}

allprojects {

  group = 'de.monticore'
  layout.buildDirectory = layout.projectDirectory.dir("target")


  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven {
      credentials.username = mavenUser
      credentials.password = mavenPassword
      url = repo
    }
    mavenCentral()
  }
}

subprojects {

  tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
      // controls whether test output is shown
      showStandardStreams = !("false").equals(getProperty('showTestOutput'))
      showExceptions = true
      showCauses = true
      showStackTraces = true
      exceptionFormat = TestExceptionFormat.FULL
      info {
        events TestLogEvent.FAILED,
                TestLogEvent.PASSED,
                TestLogEvent.SKIPPED,
                TestLogEvent.STANDARD_OUT
      }
    }
    addTestListener(new TestListener() {
      void afterTest(TestDescriptor testDescriptor, TestResult result) {
        logger.lifecycle "${testDescriptor.getClassName()} > ${testDescriptor.parent && testDescriptor.parent.getName() != testDescriptor.getClassName() ? testDescriptor.parent.getName() + " " + testDescriptor.getDisplayName() : testDescriptor.getName()} ${result.resultType}"
      }

      void afterSuite(TestDescriptor suite, TestResult result) {
        if (!suite.parent) { // will match the outermost suite
          def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
          def startItem = '|  ', endItem = '  |'
          logger.lifecycle startItem + output + endItem
        }
      }

      // Required for Gradle version < 9.x
      void beforeSuite(TestDescriptor suite) {
      }

      void beforeTest(TestDescriptor testDescriptor) {
      }
    })
    reports {
      junitXml.required = false
      html.required = false
    }
  }

}

publishing {
  publications {
    maven(MavenPublication) {
      from(components.java)
    }
  }
  repositories.maven {
    credentials.username = mavenUser
    credentials.password = mavenPassword
    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/monticore-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/monticore-snapshots/"
    url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
  }
}
