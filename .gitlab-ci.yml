workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:8.5-jdk21

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

build_gradle:
  stage: build
  script:
    - "gradle test build"
  artifacts:
    paths:
      - "target"
    expire_in: 1 week
